# Nginx config — frontend container homolog
# - Serve PWA static (vite dist)
# - Proxy /api → api:3000 (backend container)
# - Healthcheck local em /health-nginx
# - SSL terminação feita por nginx HOST (com certbot Let's Encrypt) que
#   faz proxy_pass para este container na porta 80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Logs estruturados — stdout (capturado por docker logs)
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Healthcheck próprio do nginx (não conflita com /health da API)
    location = /health-nginx {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy reverso para API backend (container name "api")
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts coerentes com SPEC (api 30s)
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health endpoints do backend (sem prefixo /api)
    location ~ ^/(health|ready)$ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    # Service Worker do PWA — não cachear longo
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets hashados — cache forte
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — qualquer rota não-match cai em index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Hardening básico
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # CSP simples (ajustar se for embedar 3rd-party)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # Limite upload coerente com SPEC (10 MB)
    client_max_body_size 10m;
}
